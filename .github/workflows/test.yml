name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:scenes
      - run: npm run validate:unreachable
      - run: npm run check:pt-br
      - run: npm run check:ascii-art
      - run: npm run validate:i18n
      - run: npm run validate:i18n:translations
      - run: npm run check:engine-boundaries
      - run: npm run build
      - run: npm run test
